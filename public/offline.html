<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RepsLoop — Offline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      color: #f5f5f5;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .container {
      max-width: 360px;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 2px;
      color: #f97316;
      margin-bottom: 8px;
    }

    p {
      color: #888888;
      font-size: 15px;
      line-height: 1.6;
    }

    .retry {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 32px;
      background: #f97316;
      color: #0a0a0a;
      font-weight: 600;
      border-radius: 12px;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .retry:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>REPSLOOP</h1>
    <p>You're currently offline. Check your connection and try again.</p>
    <a href="/" class="retry" onclick="window.location.reload(); return false;">Retry</a>
  </div>
</body>

</html>
